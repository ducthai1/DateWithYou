  <path d="M48 11.5 C48 14.8 49.2 16 52.5 16 C49.2 16 48 17.2 48 20.5 C48 17.2 46.8 16 43.5 16 C46.8 16 48 14.8 48 11.5 Z" fill="#ffffff"/>
